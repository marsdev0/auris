name: auris-server

services:

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: auris-nacos
    ports:
      - "8848:8848"  # HTTP API（控制台、旧版客户端）
      - "9848:9848"  # gRPC（Nacos 2.x 客户端主要通信方式，注册发现用的就是这个）
    environment:
      MODE: standalone
    volumes:
      - nacos-data:/home/nacos/data

  mysql:
    image: mysql:8.0
    container_name: auris-mysql
    ports:
      - "3306:3306"  # 暴露给宿主机
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auris # 自动创建数据库
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4
    container_name: auris-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always
    command: redis-server --appendonly yes

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: auris-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller           # KRaft：同时担任 Broker 和 Controller
      KAFKA_LISTENERS: INTERNAL://kafka:29092,HOST://0.0.0.0:9092,DOCKER://kafka:9094,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092,DOCKER://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093    # 单节点：只有自己一个投票者
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg               # KRaft 集群 ID（开发环境固定即可）
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1         # 单节点副本数设 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false             # 禁止自动创建 Topic
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: always

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: auris-kafka-ui
    ports:
      - "9000:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: auris-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    restart: always

  # 对象存储(P12-D8):S3 兼容,存配音产物,asset 改预签名 URL 分发
  # 选型 RustFS 而非 MinIO:2026-11-01 核实 MinIO 社区版仓库已归档(见 D8 方案 §3)
  # 宿主端口避让:9000 被 kafka-ui 占 → api 映射 9100、console 映射 9101(容器内仍是 9000/9001)
  rustfs:
    image: rustfs/rustfs:latest
    container_name: auris-rustfs
    ports:
      - "9100:9000"  # S3 API(boto3/AWS SDK endpoint 用 http://localhost:9100,path-style)
      - "9101:9001"  # Web 控制台
    environment:
      RUSTFS_ACCESS_KEY: auris          # 开发凭证,与 mysql root/root 同级约定
      RUSTFS_SECRET_KEY: auris-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error   # 日志走 stdout(docker logs);不配 LOG_DIRECTORY(非 root 写不了 /var/log)
    volumes:
      - rustfs-data:/data
    command: ["/data"]   # 数据目录作位置参数(官方 docker run 同款)
    restart: always

volumes:
  nacos-data:
  mysql-data:
  redis-data:
  kafka-data:
  rustfs-data:
