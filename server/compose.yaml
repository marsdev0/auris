name: auris-server

services:

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: auris-nacos
    ports:
      - "8848:8848"  # HTTP API (console, legacy clients)
      - "9848:9848"  # gRPC (primary channel for Nacos 2.x clients, used by registration/discovery)
    environment:
      MODE: standalone
    volumes:
      - nacos-data:/home/nacos/data

  mysql:
    image: mysql:8.0
    container_name: auris-mysql
    ports:
      - "3306:3306"  # exposed to the host
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auris # auto-create database
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4
    container_name: auris-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always
    command: redis-server --appendonly yes

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: auris-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller           # KRaft: acts as both broker and controller
      KAFKA_LISTENERS: INTERNAL://kafka:29092,HOST://0.0.0.0:9092,DOCKER://kafka:9094,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092,DOCKER://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093    # single node: only one voter
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg               # KRaft cluster id (fixed for dev)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1         # replication factor 1 for single node
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false             # disable auto topic creation
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: always

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: auris-kafka-ui
    ports:
      - "9000:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: auris-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    restart: always

  # Object storage (P12-D8): S3-compatible, holds dubbing artifacts; asset delivery via presigned urls.
  # RustFS over MinIO: verified on 2026-11-01 that the MinIO community repo is archived (see D8 plan section 3).
  # Host port avoidance: 9000 taken by kafka-ui -> api mapped to 9100, console to 9101 (container still 9000/9001)
  rustfs:
    image: rustfs/rustfs:latest
    container_name: auris-rustfs
    ports:
      - "9100:9000"  # S3 API (boto3/AWS SDK endpoint http://localhost:9100, path-style)
      - "9101:9001"  # web console
    environment:
      RUSTFS_ACCESS_KEY: auris          # dev credentials, same convention as mysql root/root
      RUSTFS_SECRET_KEY: auris-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error   # logs to stdout (docker logs); no LOG_DIRECTORY (non-root cannot write /var/log)
    volumes:
      - rustfs-data:/data
    command: ["/data"]   # data dir as positional arg (same as official docker run)
    restart: always

volumes:
  nacos-data:
  mysql-data:
  redis-data:
  kafka-data:
  rustfs-data:
