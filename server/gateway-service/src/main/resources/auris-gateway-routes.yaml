# 网关路由表（本地为主；如需不改代码调整路由，可发布同名 dataId 到 Nacos 覆盖）
# 注意: Spring Cloud 2025.0+ key 为 spring.cloud.gateway.server.webflux.routes
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # engine 直通路由(P12-D6:前端全部流量必须走 gateway 的纪律落地;
            # engine 未注册 Nacos,故 uri 直连——网关仍是唯一入口,鉴权/限流位不缺)
            - id: engine-asr
              uri: http://127.0.0.1:18000
              predicates:
                - Path=/v1/asr/**
            - id: ai-service
              uri: lb://ai-service          # 从 Nacos 服务发现找名为 ai-service 的实例
              predicates:
                - Path=/v1/transcribe/**, /v1/byok/**, /v1/dubbing/**   # dubbing=P12-D6
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@ipKeyResolver}"
            - id: user-service
              uri: lb://user-service        # 登录/注册入口;防爆破限流后续按用户名维度加
              predicates:
                - Path=/v1/auth/**
            - id: push-service
              uri: lb://push-service        # 通知读取(红点轮询 30s 一次/用户,量小暂不限流);DLQ 运维接口后续加内部认证
              predicates:
                - Path=/v1/notification/**
