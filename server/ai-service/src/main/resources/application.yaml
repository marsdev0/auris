server:
  port: 8081

spring:
  application:
    name: ai-service

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/auris?useUnicode=true&characterEncoding=utf-8&connectionTimeZone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      enabled: true  # enable multipart upload
      max-file-size: 10MB  # max size per file
      max-request-size: 10MB # max size per request
      file-size-threshold: 0 # spill to temp file immediately, no heap, streamed on forward

  kafka:
    bootstrap-servers: localhost:9092   # HOST listener (compose INTERNAL is for the docker network)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                        # no event loss: all-ISR ack (on single replica = on disk)

engine:
  base-url: http://127.0.0.1:18000
  provider: qwen3-asr

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      # no logic-delete config: hard delete (P3 section 2.8), entity has no is_deleted column; the config was a wrong signal and got removed

auris:
  jwt:
    access-token-secret: ${JWT_ACCESS_SECRET:auris-access-secret-key-2026-change-in-prod}
    issuer: auris
  byok:
    # AES-256 master key (32 bytes base64); prod must inject BYOK_MASTER_KEY, this is a dev-only default
    master-key: ${BYOK_MASTER_KEY:cyOkERCuEofTKaERZwLhAueq3dIjgccZ6nAfHlEHIvI=}
    key-version: 1
  storage:
    endpoint: ${RUSTFS_ENDPOINT:http://localhost:9100}
    access-key: ${RUSTFS_ACCESS_KEY:auris}
    secret-key: ${RUSTFS_SECRET_KEY:auris-secret}
    bucket: ${RUSTFS_BUCKET:auris-dubbing}
    presign-expire: ${PRESIGN_EXPIRE_S:900}s
