server:
  port: 8081

spring:
  application:
    name: ai-service

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/auris?useUnicode=true&characterEncoding=utf-8&connectionTimeZone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      enabled: true  # 启用文件上传
      max-file-size: 10MB  # 单个文件最大size
      max-request-size: 10MB # 整个请求最大size
      file-size-threshold: 0 # 直接落临时文件，不占堆，转发时流式读盘

engine:
  base-url: http://127.0.0.1:18000
  provider: qwen3-asr

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      # 不配 logic-delete:硬删(P3 §2.8),实体无 is_deleted 字段,配置是错误信号已摘除

auris:
  jwt:
    access-token-secret: ${JWT_ACCESS_SECRET:auris-access-secret-key-2026-change-in-prod}
    issuer: auris
