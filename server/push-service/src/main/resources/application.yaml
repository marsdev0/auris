server:
  port: 8083

spring:
  application:
    name: push-service

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/auris?useUnicode=true&characterEncoding=utf-8&connectionTimeZone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092   # HOST listener(compose 的 INTERNAL 是容器网用,与 ai-service 同)
    producer:                           # ChannelRouter 发渠道 topic / RetryScanner 重投,都走 kafkaTemplate
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                         # 与 ai-service 同款:投递指令不丢
    consumer:                           # EventConsumer / InAppWorker(manualAckFactory 手动 ack)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest       # 新消费组从头消费,启动前的存量事件不漏(at-least-once 的起点)

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

auris:
  jwt:
    access-token-secret: ${JWT_ACCESS_SECRET:auris-access-secret-key-2026-change-in-prod}
    issuer: auris
