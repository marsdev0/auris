[project]
name = "auris-engine"
version = "0.1.0"
description = "Auris AI engine — ASR/TTS/Agent voice service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# engine 是根级包（直接长在 monorepo 根下），用 setuptools find 发现它
[tool.setuptools.packages.find]
include = ["engine*"]
